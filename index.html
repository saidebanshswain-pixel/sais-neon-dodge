<!DOCTYPE html>
<html>
<head>
  <title>Neon Dodge+</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      text-align: center;
      background: black;
      color: white;
      font-family: Arial;
    }

    h1 {
      margin: 10px;
      color: #00ffcc;
    }

    canvas {
      background: black;
      border: 2px solid #222;
      border-radius: 8px;
    }

    #ui {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 5px;
    }
  </style>
</head>
<body>

<h1>NEON DODGE+</h1>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<div id="ui">
  <div id="score">Score: 0</div>
  <div id="highScore">High: 0</div>
</div>

<!-- 🎵 Music -->
<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_115b9b4c6c.mp3" type="audio/mp3">
</audio>

<script src="game.js"></script>

</body>
</html>
